[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leancert"
version = "2.2.0"
description = "Formal verification for numerical Python code - powered by Lean4"
readme = "README.md"
license = "LicenseRef-LeanCert-Evaluation-1.0 AND Apache-2.0"
license-files = ["LICENSE", "LICENSES/*", "LICENSE_SCOPE.toml", "COMMERCIAL.md", "THIRD_PARTY_NOTICES.md"]
authors = [
    {name = "Alejandro Radisic"}
]
keywords = [
    "formal-verification",
    "theorem-prover",
    "interval-arithmetic",
    "neural-network-verification",
    "lean4",
    "mathematical-proofs",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
requires-python = ">=3.10,<3.15"
dependencies = [
    "lean-runtime>=2.0.9,<3.0.0",
    "numpy>=1.23.5",
]

[project.scripts]
leancert = "leancert.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0,<10.0",
    "pytest-cov>=4.0,<8.0",
]
lint = [
    "ruff>=0.16.0,<0.17.0",
]
typecheck = [
    "mypy>=1.10,<3.0",
]
release = [
    "build>=1.0,<2.0",
    "twine>=5.0,<7.0",
]
dev = [
    "pytest>=7.0,<10.0",
    "pytest-cov>=4.0,<8.0",
    "mypy>=1.10,<3.0",
    "ruff>=0.16.0,<0.17.0",
]
pytorch = [
    "torch>=2.0",
]

[project.urls]
Homepage = "https://github.com/alerad/leancert-python"
Documentation = "https://docs.leancert.io/python/"
Repository = "https://github.com/alerad/leancert-python"
Issues = "https://github.com/alerad/leancert-python/issues"

[tool.setuptools.packages.find]
include = ["leancert*"]
exclude = ["leancert.tests*"]

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line too long - handled by formatter

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["leancert/tests"]
python_files = "test_*.py"
addopts = "-v --tb=short -m 'not integration'"
markers = [
    "integration: launches the managed Lean bridge and may hydrate large dependencies",
]

# MyPy configuration
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = ["^leancert/tests/"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
