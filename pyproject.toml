[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leancert"
version = "0.3.1"
description = "Formal verification for numerical Python code - powered by Lean4"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "LeanCert Contributors"}
]
keywords = [
    "formal-verification",
    "theorem-prover",
    "interval-arithmetic",
    "neural-network-verification",
    "lean4",
    "mathematical-proofs",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]
pytorch = [
    "torch>=2.0",
]

[project.urls]
Homepage = "https://github.com/alerad/leancert-python"
Documentation = "https://leancert.readthedocs.io"
Repository = "https://github.com/alerad/leancert-python"
Issues = "https://github.com/alerad/leancert-python/issues"

[tool.setuptools]
packages = ["leancert"]
include-package-data = true

[tool.setuptools.package-data]
leancert = ["bin/*"]

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line too long - handled by formatter

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["leancert/tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

# MyPy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
