schema_version = 1
baseline_commit = "716cb2d"
baseline_tag = "v0.3.2-apache-final"
new_original_material_license = "LicenseRef-LeanCert-Evaluation-1.0"
path_pattern_syntax = "gitignore"
unmatched_path_policy = "error"
overlapping_scope_policy = "error"
classifies = ["repository-checkout", "sdist", "wheel"]
directory_entry_policy = "ignore"
symlink_policy = "classify-link-path-without-following-target"
git_submodule_policy = "classify-gitlink-without-following-contents"

# Resolution rules:
#
# * Every tracked file-like entry in a repository checkout and every file in
#   an sdist or wheel must match exactly one scope. There is no first-match or
#   last-match precedence, and an exact path does not override a pattern.
#   Overlapping and unmatched paths are errors.
# * Checkout paths are POSIX-style and relative to the repository root. For an
#   sdist, the archive's single top-level project directory is removed before
#   matching. Wheel member paths are matched as stored in the archive.
# * Directory entries themselves are ignored. A symlink is classified at its
#   own path without following its target. A Git submodule entry is classified
#   at its gitlink path without traversing its separately licensed contents.
# * `new_original_material_license` is a development policy, not a fallback:
#   new material must still be added explicitly to exactly one scope.
# * For a mixed-origin file, the expression states the combined obligations
#   applying to that file as distributed. It does not make every source
#   portion independently available under every listed license. Apache-2.0
#   continues to govern the baseline portions preserved at `baseline_commit`;
#   the evaluation license governs original post-baseline additions.

[[scope]]
classification = "evaluation-only"
license_expression = "LicenseRef-LeanCert-Evaluation-1.0"
paths = [
  "docs/**",
  "leancert/ast/**",
  "leancert/cli.py",
  "leancert/doctor.py",
  "leancert/export.py",
  "leancert/operations/**",
  "leancert/protocol.py",
  "leancert/proving.py",
  "leancert/verification.py",
  "leancert/tests/fixtures/ast-v1/**",
  "leancert/tests/fixtures/bridge-contract-1.1/**",
  "leancert/tests/fixtures/bridge-contract-2.0/**",
  "leancert/tests/fixtures/bridge-contract-2.1/**",
  "leancert/tests/test_doctor.py",
  "leancert/tests/test_eventual_bounds.py",
  "leancert/tests/test_export.py",
  "leancert/tests/test_protocol_v2.py",
  "leancert/tests/test_semantic_ast.py",
  "leancert/tests/test_semantic_ast_contract.py",
  "leancert/tests/test_system_roots.py",
  "leancert/tests/test_unified_prove.py",
  "leancert/tests/test_verification_cli.py",
]

[[scope]]
classification = "mixed-origin"
license_expression = "Apache-2.0 AND LicenseRef-LeanCert-Evaluation-1.0"
note = "Aggregate expression only; it does not dual-license each source portion."
paths = [
  ".github/workflows/build-wheels.yml",
  "README.md",
  "bridge-version.txt",
  "leancert/__init__.py",
  "leancert/adaptive.py",
  "leancert/client.py",
  "leancert/exceptions.py",
  "leancert/expr.py",
  "leancert/nn.py",
  "leancert/quantifier.py",
  "leancert/result.py",
  "leancert/simplify.py",
  "leancert/solver.py",
  "leancert/tests/test_bound_outcomes.py",
  "leancert/tests/test_adaptive_expansions.py",
  "leancert/tests/test_client_contract.py",
  "leancert/tests/test_expr.py",
  "leancert/validation.py",
  "pyproject.toml",
]

[[scope]]
classification = "apache-baseline-unchanged"
license_expression = "Apache-2.0"
paths = [
  ".gitignore",
  "MANIFEST.in",
  "RELEASING.md",
  "examples/nn_verification.py",
  "leancert/_version.py",
  "leancert/config.py",
  "leancert/domain.py",
  "leancert/py.typed",
  "leancert/rational.py",
  "leancert/tests/__init__.py",
  "leancert/tests/test_adaptive_verification.py",
  "leancert/tests/test_algebraic_splitting.py",
  "leancert/tests/test_api.py",
  "leancert/tests/test_comprehensive.py",
  "leancert/tests/test_config.py",
  "leancert/tests/test_domain.py",
  "leancert/tests/test_domain_splitting.py",
  "leancert/tests/test_nn.py",
  "leancert/tests/test_proof_assembly.py",
  "leancert/tests/test_quantifier_synthesis.py",
  "leancert/tests/test_rational.py",
  "leancert/tests/test_result.py",
  "leancert/tests/test_simplify.py",
  "leancert/tests/test_witness.py",
]

[[scope]]
classification = "separately-licensed-bundled-binary"
license_expression = "Apache-2.0"
paths = ["leancert/bin/**"]
note = "LeanCert Bridge binaries retain their separately distributed Apache-2.0 license."

[[scope]]
classification = "licensing-and-administrative"
license_expression = "SEE-FILE"
paths = [
  "LICENSE",
  "LICENSES/**",
  "LICENSE_SCOPE.toml",
  "COMMERCIAL.md",
  "THIRD_PARTY_NOTICES.md",
]

[[scope]]
classification = "generated"
license_expression = "DERIVED-FROM-INPUTS"
paths = [
  "build/**",
  "dist/**",
  "*.egg-info/**",
  "*.dist-info/**",
  "PKG-INFO",
  "setup.cfg",
]
note = "Generated archives and build products inherit the licenses of the material they contain."
