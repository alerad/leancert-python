name: Build Python distributions

env:
  LEAN_RUNTIME_VERSION: 4.0.1

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'leancert/**'
      - 'examples/**'
      - 'docs/**'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'scripts/check_wheel.py'
      - '.github/workflows/build-wheels.yml'
  workflow_dispatch:

jobs:
  compatibility-tests:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[test]'
      - name: Run the complete Bridge-independent suite
        run: pytest -q

  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: >-
          pip install
          "lean-runtime==${LEAN_RUNTIME_VERSION}"
      - run: pip install -e '.[test,lint]'
      - name: Reject syntax and undefined-name regressions
        run: python -m ruff check leancert --exclude tests --select E9,F63,F7,F82
      - name: Run Bridge-independent safety and contract tests
        run: >-
          pytest -q
          leancert/tests/test_bound_outcomes.py
          leancert/tests/test_client_contract.py
          leancert/tests/test_protocol_v2.py
          leancert/tests/test_unified_prove.py
          leancert/tests/test_eventual_bounds.py
          leancert/tests/test_integral_claims.py
          leancert/tests/test_strict_bounds.py
          leancert/tests/test_scalar_roots.py
          leancert/tests/test_system_roots.py
          leancert/tests/test_registered_enclosures.py
          leancert/tests/test_export.py
          leancert/tests/test_verification_cli.py
          leancert/tests/test_doctor.py
          leancert/tests/test_result.py
          leancert/tests/test_rational.py

  build-distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: >-
          python -c 'import os,tomllib; version=tomllib.load(open("pyproject.toml","rb"))["project"]["version"]; assert os.environ["GITHUB_REF_NAME"] == "v" + version'
      - run: pip install '.[release]'
      - run: python -m build
      - name: Assert clean pure-Python wheel contents
        run: python scripts/check_wheel.py dist/*.whl
      - name: Validate distribution metadata
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          retention-days: 7

  test-wheel:
    needs: build-distributions
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Install ready-program runtime
        shell: bash
        run: >-
          pip install
          "lean-runtime==${LEAN_RUNTIME_VERSION}"
      - name: Install wheel
        shell: bash
        run: pip install dist/*.whl
      - name: Smoke-test lazy managed client
        shell: bash
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version

          import leancert
          from leancert.client import (
              DEFAULT_BRIDGE_PACKAGE_REF,
              DEFAULT_BRIDGE_PROGRAM_LIBRARY,
              LeanClient,
          )

          client = LeanClient()
          assert version("lean-runtime") == os.environ["LEAN_RUNTIME_VERSION"]
          assert client.package_ref == DEFAULT_BRIDGE_PACKAGE_REF
          assert DEFAULT_BRIDGE_PROGRAM_LIBRARY.endswith("leancert-bridge-programs")
          assert client.execution_id is None
          assert client._environment is None
          assert client._program is None
          print("pure Python managed-runtime wheel smoke test passed")
          PY

  managed-runtime-integration:
    needs: build-distributions
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Install ready-program runtime
        shell: bash
        run: >-
          pip install
          "lean-runtime==${LEAN_RUNTIME_VERSION}"
      - name: Install the built SDK
        shell: bash
        run: pip install dist/*.whl
      - name: Prove through the published ready-to-run program
        shell: bash
        env:
          LEAN_RUNTIME_AVAILABILITY: required
        run: |
          python - <<'PY'
          import leancert as lc

          x = lc.ast.var("x")
          result = lc.prove(x * x <= 1, where={x: (-1, 1)})
          assert isinstance(result, lc.Verified), result
          assert result.provenance.execution_route == "program"
          assert result.provenance.environment_id is None
          assert result.provenance.program_id.startswith("program_")
          assert result.provenance.execution_id.startswith("execution_")
          print(result.provenance.program_id)

          legacy_x = lc.var("x")
          with lc.Solver() as solver:
              adaptive = lc.verify_bound_adaptive(
                  solver,
                  legacy_x * legacy_x,
                  {"x": (-1, 1)},
                  upper=2,
                  adaptive_config=lc.AdaptiveConfig(parallel=True, max_splits=2),
              )
          assert adaptive.verified, adaptive
          PY

  publish:
    needs: [compatibility-tests, safety-tests, build-distributions, test-wheel, managed-runtime-integration]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Require the managed runtime release on PyPI
        run: pip install "lean-runtime==${LEAN_RUNTIME_VERSION}"
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
