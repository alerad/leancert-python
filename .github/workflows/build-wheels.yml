name: Build Python distributions

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'leancert/**'
      - 'examples/**'
      - 'docs/**'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - '.github/workflows/build-wheels.yml'
  workflow_dispatch:

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - name: Run Bridge-independent safety and contract tests
        run: >-
          pytest -q
          leancert/tests/test_bound_outcomes.py
          leancert/tests/test_client_contract.py
          leancert/tests/test_protocol_v2.py
          leancert/tests/test_unified_prove.py
          leancert/tests/test_eventual_bounds.py
          leancert/tests/test_integral_claims.py
          leancert/tests/test_strict_bounds.py
          leancert/tests/test_scalar_roots.py
          leancert/tests/test_system_roots.py
          leancert/tests/test_registered_enclosures.py
          leancert/tests/test_export.py
          leancert/tests/test_verification_cli.py
          leancert/tests/test_doctor.py
          leancert/tests/test_result.py
          leancert/tests/test_rational.py

  build-distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install build
      - run: python -m build
      - name: Assert a pure Python wheel
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -name '*-py3-none-any.whl' | wc -l)" -eq 1
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              forbidden = [
                  name for name in archive.namelist()
                  if "/bin/" in name or name.endswith(("lean_bridge", "lean_bridge.exe"))
              ]
          assert not forbidden, forbidden
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          retention-days: 7

  test-wheel:
    needs: build-distributions
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Install wheel
        shell: bash
        run: pip install dist/*.whl
      - name: Smoke-test lazy managed client
        shell: bash
        run: |
          python - <<'PY'
          from importlib.metadata import version

          import leancert
          from leancert.client import (
              DEFAULT_BRIDGE_PACKAGE_REF,
              DEFAULT_RUNTIME_CACHES,
              LeanClient,
          )

          client = LeanClient()
          assert version("lean-runtime").split(".", 1)[0] == "1"
          assert client.package_ref == DEFAULT_BRIDGE_PACKAGE_REF
          assert DEFAULT_RUNTIME_CACHES[0] == "oci://ghcr.io/alerad/leancert-runtime"
          assert client.execution_id is None
          assert client._environment is None
          print("pure Python managed-runtime wheel smoke test passed")
          PY

  managed-runtime-integration:
    needs: build-distributions
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Install the built SDK
        shell: bash
        run: pip install dist/*.whl
      - name: Prove through the published OCI environment
        shell: bash
        env:
          LEAN_RUNTIME_PREBUILT: require
        run: |
          python - <<'PY'
          import leancert as lc

          x = lc.ast.var("x")
          result = lc.prove(x * x <= 1, where={x: (-1, 1)})
          assert isinstance(result, lc.Verified), result
          assert result.provenance.environment_id.startswith("env_")
          assert result.provenance.execution_id.startswith("execution_")
          print(result.provenance.environment_id)
          PY

  publish:
    needs: [safety-tests, build-distributions, test-wheel, managed-runtime-integration]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Require the managed runtime release on PyPI
        run: pip install 'lean-runtime>=1.0.0,<2.0.0'
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
